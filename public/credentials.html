<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>参赛凭据 · 赛鸽血统环号登记站</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <div><h1>参赛凭据</h1><div class="meta">血统/成绩指纹绑定 · 改血统或归巢成绩后旧凭据失效并补发</div></div>
    <nav>
      <a href="/">正式档案</a>
      <a href="/migration">迁移并册</a>
      <a href="/credentials" class="active">参赛凭据</a>
    </nav>
  </header>
  <main class="list">
    <section class="panel">
      <h2>签发参赛凭据</h2>
      <div class="row">
        <div style="flex:1"><label>足环号</label><input id="ringNo" placeholder="CHN-2026-001"></div>
        <div style="flex:1"><label>赛事</label><input id="event" placeholder="200公里联赛"></div>
        <div style="align-self:flex-end"><button id="issueBtn">签发</button></div>
      </div>
      <div class="flash" id="flash"></div>
    </section>
    <section class="panel">
      <h2>凭据台账</h2>
      <table>
        <thead><tr><th>状态</th><th>足环号</th><th>赛事</th><th>凭据号</th><th>血统指纹</th><th>成绩指纹</th><th>补发自</th><th>失效原因</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script src="/credentials-page.js"></script>
</body>
</html>
